<div class="container">

  <mat-card class="search-card">
    <mat-card-title>Pesquisar Contato</mat-card-title>
    <button mat-raised-button color="accent" (click)="abrirDialogAdicionar()">
    <mat-icon>add</mat-icon>
    Adicionar Contato
    </button>
    <div class="search-form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nome</mat-label>
        <input matInput placeholder="Digite o nome do contato" [(ngModel)]="nome">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>

      <button mat-raised-button color="primary" (click)="buscarContato(nome)">
        Pesquisar
      </button>
    </div>
  </mat-card>

  <mat-card class="result-card">
    <mat-card-title>Resultados</mat-card-title>

    <table mat-table class="mat-elevation-z2 full-width" [dataSource]="contatos">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let element"> {{element.id}} </td>
      </ng-container>

      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef> Nome </th>
        <td mat-cell *matCellDef="let element"> {{element.nome}} </td>
      </ng-container>

      <ng-container matColumnDef="idade">
        <th mat-header-cell *matHeaderCellDef> Idade </th>
        <td mat-cell *matCellDef="let element"> {{element.idade}} </td>
      </ng-container>

      <ng-container matColumnDef="telefone">
        <th mat-header-cell *matHeaderCellDef> Telefone </th>
        <td mat-cell *matCellDef="let element"> {{element.telefone}} </td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef> Ações </th>
        <td mat-cell *matCellDef="let element">

            <button mat-icon-button color="primary" (click)="editarContato(element)">
            <mat-icon>edit</mat-icon>
            </button>

            <button mat-icon-button color="warn" (click)="deletarContato(element.id)">
            <mat-icon>delete</mat-icon>
            </button>

        </td>
        </ng-container>
      <tr mat-header-row *matHeaderRowDef="['id','nome','idade','telefone','acoes']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['id','nome','idade','telefone','acoes'];"></tr>
    </table>

  </mat-card>

</div>
